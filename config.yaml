# ─────────────────────────────────────────
#  Weather Bot v3 — Master Config
#  Strategy: lockin_v3 (observation-based)
# ─────────────────────────────────────────

mode: live
strategy: lockin_v3
bankroll_usd: 19.95

risk:
  min_lockin_prob: 0.98
  min_obs_count: 2
  max_pay_cents: 97
  min_pay_cents: 3
  min_edge_cents: 2

  kelly_fraction: 0.05
  min_trade_usd: 0.50
  max_trade_usd: 2.00
  max_per_ticker_usd: 2.00

  daily_loss_limit_pct: 0.10
  max_open_positions: 8
  min_balance_usd: 10.00
  cancel_after_seconds: 180

  # Free cash reserve — bot stops placing orders when free cash is at or below this.
  # Prevents a single scan cycle from spending the entire bankroll.
  # Set to ~10% of bankroll so there's always dry powder.
  min_free_cash_usd: 2.00

loop_sleep_seconds: 60
scan_every_n_cycles: 3

horizons:
  - same_day

cities:
  - code: NYC
    lat: 40.7789
    lon: -73.9692
    metar: KNYC
  - code: CHI
    lat: 41.9803
    lon: -87.9090
    metar: KORD
  - code: MIA
    lat: 25.7959
    lon: -80.2870
    metar: KMIA
  - code: LAX
    lat: 33.9425
    lon: -118.4081
    metar: KLAX
  - code: DEN
    lat: 39.8561
    lon: -104.6737
    metar: KDEN
  - code: BOS
    lat: 42.3643
    lon: -71.0052
    metar: KBOS
  - code: AUS
    lat: 30.1945
    lon: -97.6699
    metar: KAUS
  - code: PHIL
    lat: 39.8729
    lon: -75.2411
    metar: KPHL
  - code: HOU
    lat: 29.9844
    lon: -95.3414
    metar: KHOU

markets:
  - HIGHTEMP
  - LOWTEMP

telegram:
  enabled: true
  daily_summary_hour_utc: 5
