# ─────────────────────────────────────────
#  Weather Bot v2 — Master Config
#  Edit this file to change any setting.
#  Bot reloads config every cycle — no restart needed.
# ─────────────────────────────────────────

# Trading mode: paper = no real orders, live = real orders
mode: live

# Bankroll (updated May 2 2026 — $200 deposit)
bankroll_usd: 200.00

# Risk controls
risk:
  daily_loss_limit_pct: 0.06       # Kill bot if down 6% in one day (~$12.00)
  max_open_positions: 5            # Max concurrent open positions
  min_edge_cents: 6                # Min model edge over market mid (cents)
  max_spread_cents: 15             # Skip markets with spread wider than this
  min_entry_cents: 20              # Skip cheap low-conviction contracts
  max_entry_cents: 90              # Don't buy contracts more expensive than 90c
  max_entry_no_cents: 75           # VETERAN RULE: never pay more than 75c for a NO contract
                                   # Buying NO at 80-90c risks $4 to make $0.30 — one loss wipes 8 wins
  min_reward_ratio: 0.25           # VETERAN RULE: must stand to profit >= 25c per $1 risked
                                   # e.g. buying at 80c = 20c profit / 80c risk = 0.25 (borderline)
                                   # buying at 89c = 11c / 89c = 0.12 (REJECTED)
  min_model_prob: 0.80             # Lock-in strategy: only trade when model is >=80% confident
  kelly_fraction: 0.15             # Conservative Kelly fraction
  min_trade_usd: 1.00              # Minimum order size in dollars
  max_trade_usd: 3.00              # Maximum order size per trade
  max_per_ticker_usd: 3.00         # Hard cap per ticker
  max_contracts: 15                # Hard cap on contracts per trade
  min_balance_usd: 50.00           # Pause if balance drops below this (25% drawdown)
  cancel_after_seconds: 120        # Cancel unfilled resting orders after 2 min
  trade_start_hour_local: 6        # (legacy) kept for compatibility

  # Strategy gating: two named books (lockin + tail_short) trade at full size.
  # Legacy generic-edge scanner is also enabled but at HALF size (Option B):
  # it keeps generating data so we can compare strategies head-to-head over
  # two weeks, without doubling our risk during the experiment.
  enable_legacy_edge_path: true
  legacy_half_size: true

  # Tail-short tuning: minimum strike distance from forecast.
  # Diagnostic showed only 15.9% of decisions had |strike-forecast| >= 4.0°F
  # which combined with the narrow 15-30¢ NO price window emitted 0 trades
  # in 24h. Nudging from 4.0 -> 3.5°F to unlock marginal candidates without
  # widening the price window. Stay conservative: this is a single knob.
  tail_min_dist_f: 3.5

# Loop timing
loop_sleep_seconds: 60             # Seconds between each cycle
scan_every_n_cycles: 5            # Re-scan Kalshi markets every N cycles

# Horizons: same_day only for true lock-in strategy.
horizons:
  - same_day

cities:
  - code: NYC
    lat: 40.7789
    lon: -73.9692
    metar: KNYC
  - code: CHI
    lat: 41.7868
    lon: -87.7522
    metar: KMDW    # Kalshi settles Chicago HIGHTEMP on Midway, NOT O'Hare
  - code: MIA
    lat: 25.7959
    lon: -80.2870
    metar: KMIA
  - code: LAX
    lat: 33.9425
    lon: -118.4081
    metar: KLAX
  - code: DEN
    lat: 39.8561
    lon: -104.6737
    metar: KDEN
  - code: BOS
    lat: 42.3643
    lon: -71.0052
    metar: KBOS
  - code: AUS
    lat: 30.1945
    lon: -97.6699
    metar: KAUS
  - code: PHIL
    lat: 39.8729
    lon: -75.2411
    metar: KPHL
  - code: HOU
    lat: 29.9844
    lon: -95.3414
    metar: KHOU

markets:
  - HIGHTEMP
  - LOWTEMP

# Telegram
telegram:
  enabled: true
  daily_summary_hour_utc: 5       # Send daily summary at 5 AM UTC (midnight CT)
