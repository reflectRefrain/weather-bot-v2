# ─────────────────────────────────────────
#  Weather Bot v2 — Master Config
#  Edit this file to change any setting.
#  Bot reloads config every cycle — no restart needed.
# ─────────────────────────────────────────

# Trading mode: paper = no real orders, live = real orders
mode: live

# Bankroll (updated May 2 2026 — $200 deposit)
bankroll_usd: 200.00

# ──────────────────────────────────────────────────────────────────────────────
# 2026-05-08 MORNING-WINDOW VALIDATION CONFIG
# Backtest at the prior afternoon window (14:30-16:30 LOCAL) showed every
# strategy unprofitable. The morning window (4-9am LOCAL) showed +18-23% EV
# for mid_band and +4-9% EV for lockin_yes across 90 days/18 cities.
# We are running BOTH books at $1/contract for 30 days as live out-of-sample
# validation. tail_short, tail_long, lockin_no, and legacy are all DISABLED.
# ──────────────────────────────────────────────────────────────────────────────

# Risk controls
risk:
  daily_loss_limit_pct: 0.025      # Kill bot if down 2.5% in one day (=$5 on $200)
                                   # Validation cap: 5 losing $1 trades before halt.
  max_open_positions: 5            # Max concurrent open positions
  min_edge_cents: 6                # (legacy path) min model edge over mid — unused
  max_spread_cents: 15             # Skip markets with spread wider than this
  min_entry_cents: 20              # Skip cheap low-conviction contracts
  max_entry_cents: 90              # Don't buy contracts more expensive than 90c
  max_entry_no_cents: 75           # never pay more than 75c for a NO contract
  min_reward_ratio: 0.25           # legacy path — unused while legacy disabled
  min_model_prob: 0.80             # Lock-in only: model >=80% confident
  kelly_fraction: 0.15             # Conservative Kelly fraction
  min_trade_usd: 1.00              # Minimum order size in dollars
  max_trade_usd: 1.00              # VALIDATION CAP: $1/contract
  max_per_ticker_usd: 1.00         # VALIDATION CAP: $1/contract
  max_contracts: 2                 # Hard cap — with $1 budget and 40-49c entries,
                                   # 1-2 contracts is the realistic max anyway.
  min_balance_usd: 50.00           # Pause if balance drops below this (25% drawdown)
  cancel_after_seconds: 120        # Cancel unfilled resting orders after 2 min
  trade_start_hour_local: 6        # (legacy) kept for compatibility

  # ───────────────────────────────────────────────────────────────────────
  # STRATEGY GATING (morning-window PR)
  # Only mid_band + lockin_yes fire. Everything else off.
  # ───────────────────────────────────────────────────────────────────────
  enable_legacy_edge_path: false   # OFF — backtest -8% EV at every band
  legacy_half_size: true           # (no-op while legacy is off)

  # mid_band book: YES @ 40-49c, spread ≤ 2c, between-strikes, skip CHI/DC/ATL
  mid_band_enabled: true
  mid_band_price_min: 40
  mid_band_price_max: 49
  mid_band_max_spread_cents: 2
  mid_band_excluded_cities: ["CHI", "DC", "ATL"]
  # 2026-05-14 model gate — lifetime mid_band WR was 38.9% over 18 trades because
  # the original rule had no model check. The bot was buying YES on contracts
  # its own model predicted would lose. This requires mp_yes >= 0.55 before
  # firing. Expect trade volume to drop sharply (likely 60-80% fewer trades) —
  # that's the point. We want fewer, higher-conviction trades.
  mid_band_min_model_prob: 0.55

  # tail_short: DISABLED. Backtest -65% EV in morning, -15% in afternoon.
  # Set tail_min_prob_no to 1.01 (impossible) so the gate never opens.
  tail_min_prob_no: 1.01
  tail_min_dist_f: 3.5             # legacy parameter, kept for compatibility

  # Lockin fee-aware floor (PR #9, fee schedule verified Feb 2026).
  # Kalshi taker fee = ceil(0.07 * P * (1-P)). At yes_price=92¢ the breakeven
  # mp_yes is 0.929 — meaning a flat 0.85 threshold would pass negative-EV
  # trades in the 86-92¢ band. Bot now requires:
  #   mp_yes >= max(lockin_min_prob, breakeven + lockin_fee_buffer)
  # 0.02 buffer = 2pp cushion above pure fee breakeven.
  lockin_fee_buffer: 0.02

  # During morning-window validation, lockin_yes is the ONLY non-mid_band
  # book firing. Force lockin_no off by capping NO-side entries to a price
  # range no real book can hit:
  # NOTE: lockin currently emits YES only (book_type='lockin' → side='yes').
  # No additional gate needed; this comment documents the intent.

  # Lockin tie-buffer for Kalshi 'strictly greater than' rule:
  # NHIGH contract resolves NO if actual high == strike. Forecast must clear
  # the strike by this many degrees in the YES-winning direction so a 1°F
  # adverse miss does not land exactly on the strike line. 1.0°F is a soft
  # buffer — adjust up if we see ties resolving against us.
  lockin_tie_buffer_f: 1.0

# Loop timing
loop_sleep_seconds: 60             # Seconds between each cycle
scan_every_n_cycles: 5            # Re-scan Kalshi markets every N cycles

# Horizons: same_day only for true lock-in strategy.
horizons:
  - same_day

