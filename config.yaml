# ─────────────────────────────────────────
#  Weather Bot v3 — Master Config
#  Strategy: lockin_v3 (observation-based)
# ─────────────────────────────────────────

mode: live
strategy: lockin_v3
bankroll_usd: 19.95

risk:
  min_lockin_prob: 0.98
  min_obs_count: 2
  max_pay_cents: 97

  # Minimum contract price — blocks cheap lottery-ticket YES bets (4c, 7c etc).
  # A 4c contract means the market gives it only 4% chance. That is NOT a lock-in.
  # 25c minimum ensures we only enter when the market already agrees we're likely right.
  min_pay_cents: 25

  min_edge_cents: 5

  kelly_fraction: 0.05
  min_trade_usd: 0.50
  max_trade_usd: 1.50
  max_per_ticker_usd: 1.50

  daily_loss_limit_pct: 0.10

  # Tighter cap so we don't spread $16 across 27 positions.
  # Fewer, higher-confidence trades is better at this bankroll size.
  max_open_positions: 6

  min_balance_usd: 10.00
  cancel_after_seconds: 180

  # Free cash reserve — bot stops placing orders when free cash is at or below this.
  min_free_cash_usd: 2.00

loop_sleep_seconds: 60
scan_every_n_cycles: 3

horizons:
  - same_day

cities:
